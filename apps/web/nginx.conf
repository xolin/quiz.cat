server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'API serveix les rutes a l'ARREL (/matches, /auth, /health), i el client crida
    # /api/*. La barra final de `proxy_pass` és la que treu el prefix: sense ella
    # arribaria /api/matches i l'API respondria 404. És el mateix que fa el proxy de
    # Vite en desenvolupament (`rewrite` a vite.config.ts).
    location /api/ {
        proxy_pass http://api:4400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Els noms d'aquests fitxers porten hash: es poden cachejar per sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Les fonts són auto-allotjades i no canvien mai de nom: si no es cachegen, la
    # tipografia es torna a baixar a cada visita i el text fa el salt de font.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualsevol ruta desconeguda torna l'index i el client la resol.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
