server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'API serveix les rutes a l'ARREL (/matches, /auth, /health), i el client crida
    # /api/*. El `rewrite` és el que treu el prefix: sense ell arribaria /api/matches i
    # l'API respondria 404. És el mateix que fa el proxy de Vite en desenvolupament.
    #
    # I el nom `api` es resol A CADA PETICIÓ, no un sol cop en arrencar. Amb
    # `proxy_pass http://api:4400/` literal, nginx es guarda la IP del contenidor al
    # carregar la configuració: si després l'API es torna a crear —cosa que passa a
    # cada desplegament— canvia d'IP i nginx segueix trucant a la vella per sempre.
    # El resultat és un 502 etern amb l'API perfectament viva, i que només marxa
    # reiniciant el web. Amb la variable i el `resolver` de Docker, això no passa.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api api:4400;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Els noms d'aquests fitxers porten hash: es poden cachejar per sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Les fonts són auto-allotjades i no canvien mai de nom: si no es cachegen, la
    # tipografia es torna a baixar a cada visita i el text fa el salt de font.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualsevol ruta desconeguda torna l'index i el client la resol.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
